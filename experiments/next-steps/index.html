<!doctype html>
<html lang="en">
  <!--
    thursday-note: Next Steps - AI setup then goal + thoughts
    thursday-revisit: 2026-11-05
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Steps</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/trythursday/fieber@main/fieber.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      ai-setup {
        display: block;
      }

      main > section {
        margin-block-start: 0;
      }

      .setup {
        display: flex;
        flex: none;
        flex-direction: column;
        width: 40ch;
        max-width: 100%;
        height: 38rem;
        margin: 6rem auto 0;
        padding: 3rem;
        border: 2px solid;
        text-align: center;
      }

      .state-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
      }

      .setup h2 {
        margin-top: 0;
      }

      .setup p {
        margin-inline: auto;
        max-width: 40ch;
        text-align: left;
      }

      .ai-actions {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        margin-top: 2rem;
      }

      .ai-actions button {
        min-width: 24ch;
      }

      .button-row {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      .outlined {
        background: none;
        color: inherit;
        border: 2px solid currentColor;
      }

      .field-row {
        display: grid;
        grid-template-columns: 10ch 1fr;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
        text-align: left;
      }

      .progress {
        position: relative;
      }

      .progress span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        pointer-events: none;
      }

      .progress progress {
        width: 100%;
      }

      .setup .error {
        color: red;
      }

      .result {
        flex: 1;
        overflow-y: auto;
        text-align: left;
      }

      .result.error {
        color: red;
      }

      .centered {
        justify-content: center;
        gap: 1rem;
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }

      .spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" hidden>
      <header>
        <h1>Next Steps</h1>
        <p>
          Type your goal into the box, then any thoughts you have about the
          situation. Or click Random Example to see some possibilities.
        </p>
      </header>

      <main>
        <ai-setup></ai-setup>

        <section class="body" id="form" hidden>
          <form>
            <label for="goal">Goal</label>
            <input id="goal" name="goal" type="text" placeholder="I want to..." />
            <div class="hint-row"></div>

            <!-- TODO: markdown rendering with live preview. -->
            <label for="thoughts">Thoughts</label>
            <textarea
              id="thoughts"
              name="thoughts"
              placeholder="Type your thoughts on the goal here. Things you know, things you feel."
            ></textarea>

            <div class="input-group centered">
              <button type="button" id="random">Random example</button>
              <button type="button" id="next">Next Steps?</button>
            </div>
          </form>
        </section>

        <section class="body" id="result" hidden>
          <p class="loading" hidden>
            <span class="spinner"></span>
            Loading…
          </p>
          <div class="result"></div>
          <div class="input-group">
            <button type="button" id="back">Back</button>
          </div>
        </section>
      </main>

      <p>
        <a href="#" id="clear-settings">Clear AI settings</a>
      </p>

      <footer>
        <hr />
        <p>
          Next Steps is part of the
          <a href="https://github.com/trythursday/thursday">Thursday</a>
          project. Feel free to copy and share.
        </p>
      </footer>
    </div>
    <script type="module" src="./lib/ai-setup.js"></script>
    <script type="module">
      import { generate } from "./lib/ai.js";
      import { getApiKey, clearStorage } from "./lib/storage.js";

      const setup = document.querySelector("ai-setup");
      const root = document.querySelector("#root");
      const form = document.querySelector("#form");
      const result = document.querySelector("#result");
      const output = result.querySelector(".result");
      const next = document.querySelector("#next");
      const back = document.querySelector("#back");
      const random = document.querySelector("#random");
      const loading = result.querySelector(".loading");

      const showForm = () => {
        setup.hidden = true;
        form.hidden = false;
      };

      if (getApiKey()) showForm();

      setup.addEventListener("setup-complete", showForm);

      const goal = document.querySelector("#goal");
      const hintRow = document.querySelector(".hint-row");

      const HINTS = [
        "quit my job",
        "be a dinosaur",
        "solve world hunger",
        "fly a plane",
        "get into a relationship",
        "start exercising",
        "be a better person",
        "improve my focus",
        "write a book",
        "learn to code",
        "write the perfect resume",
      ];

      for (const hint of [...HINTS].sort(() => Math.random() - 0.5).slice(0, 3)) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `...${hint}`;
        button.addEventListener("click", () => {
          goal.value = `I want to ${hint}`;
        });
        hintRow.append(button);
      }

      const thoughts = document.querySelector("#thoughts");

      let examples;

      const loadExamples = async () => {
        if (!examples) {
          const { parse } = await import("https://esm.sh/smol-toml");
          const text = await (await fetch("./EXAMPLES.toml")).text();
          examples = parse(text).examples;
        }
        return examples;
      };

      random.addEventListener("click", async () => {
        const all = await loadExamples();
        const example = all[Math.floor(Math.random() * all.length)];

        goal.value = example.goal;
        thoughts.value = example.thoughts;
      });

      next.addEventListener("click", async () => {
        form.hidden = true;
        result.hidden = false;
        output.textContent = "";
        output.classList.remove("error");
        next.disabled = true;
        loading.hidden = false;

        try {
          const { marked } = await import("https://esm.sh/marked");

          await generate({
            goal: goal.value,
            thoughts: thoughts.value,
            onToken: (text) => {
              loading.hidden = true;
              output.innerHTML = marked.parse(text);
            },
          });
        } catch (error) {
          output.textContent =
            error?.status === 401
              ? "Try again tomorrow or clearing the AI settings."
              : error.message;
          output.classList.add("error");
        } finally {
          loading.hidden = true;
          next.disabled = false;
        }
      });

      back.addEventListener("click", () => {
        result.hidden = true;
        form.hidden = false;
      });

      const clearSettings = document.querySelector("#clear-settings");

      clearSettings.addEventListener("click", async (event) => {
        event.preventDefault();

        const { confirm } = await import("https://esm.sh/cf-alert");
        const confirmed = await confirm(
          "This deletes the saved API key, base URL and model.",
          { yes: "Clear", no: "Cancel" },
          "Clear AI settings?",
        );

        if (!confirmed) return;

        clearStorage();
        location.reload();
      });

      root.hidden = false;
    </script>
  </body>
</html>
