<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Expander</title>
  <style>
    :root {
      --fg: #151515;
      --bg: #f5f4f0;
      --accent: #777;
      --size-body: 1rem;
      --size-section: 1.2rem;
      --size-heading: 1.4rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f5f4f0;
        --bg: #151515;
      }
    }
    body {
      display: grid;
      place-items: center;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
    }
    html,
    body,
    #root,
    .io-wrapper {
      height: 100%;
    }
    textarea,
    button,
    input {
      border-radius: 0.4rem;
      font-size: var(--size-body);
      margin: 0.25rem;
      padding: 0.4rem;
      border: 2px solid var(--accent);
      color: var(--fg);
      background: var(--bg);
    }
    button {
      cursor: pointer;
    }
    textarea:focus,
    button:hover,
    button:focus,
    button:active,
    input:focus {
      border-color: currentColor;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    textarea {
      margin: 0;
      font-size: var(--size-section);
      min-height: 20ch;
      resize: vertical;
    }
    .body-main {
      max-width: 80ch;
      width: 100%;
    }
    .io-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .input-form {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 1rem;
    }
    .input-group {
      display: flex;
      justify-content: space-between;
    }
    .submit-group {
      display: flex;
      justify-content: flex-end;
      margin-top: auto;
    }
    .input-panel,
    .output-panel {
      min-height: 50ch;
      margin: 1rem 0;
    }
    .input-panel {
      display: flex;
      flex-direction: column;
    }
    .output-panel {
      border: 1px dashed red;
      border-radius: 0.4rem;
      margin-top: 0;
      overflow: scroll;
    }
    .output-content {
      font-size: var(--size-body);
    }
    .output-content h1,
    .output-content h2,
    .output-content h3 {
      font-size: var(--size-heading);
    }
    .output-content code,
    .output-content pre {
      font-size: var(--size-body);
    }
    .debug-panel summary {
      cursor: pointer;
    }
    .raw-toggle {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin: 0.25rem;
    }
    .raw-toggle input {
      margin: 0;
    }
    .system-prompt {
      width: 100%;
      min-height: 30ch;
      font-size: var(--size-body);
    }
  </style>
</head>
<body>
  <div class="body-main" id="root">
    <div class="io-wrapper">
      <div class="input-panel">
        <h1>Idea Expander</h1>
        <div class="input-group key-group">
          <label for="api-key">API key</label>
          <input type="password" id="api-key" class="api-key" placeholder="sk-or-v1-…" />
        </div>
        <p>Put in your thoughts below, then click <code>Go</code> to expand the idea, or carry out your specified task.</p>
        <form class="input-form">
          <textarea placeholder="Type anything here, then press expand."></textarea>
          <div class="input-group submit-group">
            <button type="submit">Expand</button>
            <button type="button" disabled>Save</button>
            <label class="raw-toggle">
              <input type="checkbox" class="raw-checkbox" />
              Raw
            </label>
          </div>
        </form>
        <details class="debug-panel">
          <summary>System prompt</summary>
          <textarea class="system-prompt"></textarea>
        </details>
      </div>
      <div class="output-panel">
        <div class="output-content"></div>
      </div>
    </div>
  </div>
  <script type="module">
    import { marked } from "https://esm.sh/marked";
    import { OpenRouter } from "https://esm.sh/@openrouter/sdk";

    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.querySelector(".input-form");
      const textarea = form.querySelector("textarea");
      const output = document.querySelector(".output-content");
      const expandButton = form.querySelector("button[type='submit']");
      const systemPrompt = document.querySelector(".system-prompt");
      const rawCheckbox = document.querySelector(".raw-checkbox");
      const apiKey = document.querySelector(".api-key");

      apiKey.value = localStorage.getItem("openrouter-api-key") ?? "";
      apiKey.addEventListener("change", () => {
        localStorage.setItem("openrouter-api-key", apiKey.value);
      });

      let lastResponse = "";

      const render = () => {
        if (!lastResponse) return;
        output.innerHTML = rawCheckbox.checked
          ? `<pre>${lastResponse.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</pre>`
          : marked.parse(lastResponse);
      };

      rawCheckbox.addEventListener("change", render);

      systemPrompt.value = await (await fetch("./SYSTEM_PROMPT.md")).text();

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        expandButton.disabled = true;
        expandButton.textContent = "Expanding...";
        try {
          const openrouter = new OpenRouter({ apiKey: apiKey.value });
          const completion = await openrouter.chat.send({
            chatRequest: {
              model: "xiaomi/mimo-v2.6-flash",
              messages: [
                { role: "system", content: systemPrompt.value },
                { role: "user", content: textarea.value },
              ],
              provider: {
                only: ["makora/fp8"],
                allow_fallbacks: false,
              },
            },
          });
          lastResponse = completion.choices[0].message.content;
          render();
        } finally {
          expandButton.disabled = false;
          expandButton.textContent = "Expand";
        }
      });
    });
  </script>
</body>
</html>
