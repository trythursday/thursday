# Realistic inputs for Next Steps. Fetched by index.html.

[[examples]]
goal = "I want to quit my job"
thoughts = """
I have been at the same company for four years. I dread Sunday nights and I am
not learning anything anymore. I have three months of savings and a partner who
can cover rent for a while. I do not know what I would do next, but I know I
cannot stay another year.
"""

[[examples]]
goal = "I want to learn to code"
thoughts = """
I have tried a few tutorials and always stop around functions. I use
spreadsheets a lot at work and keep thinking a small tool would save me hours.
I have maybe five hours a week and a laptop.
"""

[[examples]]
goal = "I want to write a book"
thoughts = """
I have an idea about a detective in a small town, but every time I sit down I
freeze. I have never written anything longer than a school essay. I read a lot
of crime novels and I have notes on my phone.
"""

[[examples]]
goal = "I want to start exercising"
thoughts = """
