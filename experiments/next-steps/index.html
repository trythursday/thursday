<!doctype html>
<html lang="en">
  <!--
    thursday-note: Next Steps - AI setup then goal + thoughts
    thursday-revisit: 2026-11-05
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Steps</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/trythursday/fieber@main/fieber.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./alert.css" />
    <style>
      ai-setup {
        display: block;
      }

      main > section {
        margin-block-start: 0;
      }

      .setup {
        width: 40ch;
        max-width: 100%;
        margin: 6rem auto 0;
        padding: 3rem;
        border: 2px solid;
        text-align: center;
      }

      .setup h2 {
        margin-top: 0;
      }

      .setup p {
        margin-inline: auto;
        max-width: 40ch;
        text-align: left;
      }

      .ai-actions {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        margin-top: 2rem;
      }

      .ai-actions button {
        min-width: 24ch;
      }

      .button-row {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      .outlined {
        background: none;
        color: inherit;
        border: 2px solid currentColor;
      }

      .field-row {
        display: grid;
        grid-template-columns: 10ch 1fr;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
        text-align: left;
      }

      .progress {
        position: relative;
      }

      .progress span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.2rem;
        pointer-events: none;
      }

      .progress progress {
        width: 100%;
      }

      .setup .error {
        color: red;
      }

      .result {
        text-align: left;
      }

      .result.error {
        color: red;
      }

      .centered {
        justify-content: center;
        gap: 1rem;
      }

      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }

      .spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" hidden>
      <header>
        <h1>Next Steps</h1>
        <p>Get anything done by starting now.</p>
      </header>

      <main>
        <ai-setup></ai-setup>

        <section class="body" id="form" hidden>
          <form>
            <p>
              Type your goal into the box, then any thoughts you have about the
              situation. Or click Random Example to see some possibilities.
            </p>
            <label for="goal">Goal</label>
            <input id="goal" name="goal" type="text" placeholder="I want to..." />
            <div class="hint-row"></div>

            <!-- TODO: markdown rendering with live preview. -->
            <label for="thoughts">Thoughts</label>
            <textarea
              id="thoughts"
              name="thoughts"
              placeholder="Type your thoughts on the goal here. Things you know, things you feel."
            ></textarea>

            <div class="input-group centered">
              <button type="button" id="random">Random example</button>
              <button type="button" id="next">Next Steps?</button>
            </div>
          </form>
        </section>

        <section class="body" id="result" hidden>
          <p class="loading" hidden>
            <span class="spinner"></span>
            <span class="loading-text">Loading…</span>
          </p>
          <div class="result"></div>
          <div class="input-group">
            <button type="button" id="back">Back</button>
          </div>
        </section>
      </main>

      <footer>
        <hr />
        <p>
          <a href="#" id="clear-settings">Clear AI settings</a>
        </p>
        <p>
          Next Steps is part of the
          <a href="https://github.com/trythursday/thursday">Thursday</a>
          project. Feel free to copy and share.
        </p>
      </footer>
    </div>
    <script type="module" src="./lib/ai-setup.js"></script>
    <script type="module" src="./lib/main.js"></script>
  </body>
</html>
